# Decap CMS configuration — this file controls the /admin editing panel.
# Full reference: https://decapcms.org/docs/configuration-options/
#
# Auth is handled by DecapBridge (https://decapbridge.com), a free
# authentication bridge for Decap CMS. Netlify's own "Git Gateway" (the
# original way to do this) has been deprecated, so this project uses
# DecapBridge instead — same underlying git-gateway protocol, different
# auth provider. Manage collaborators at https://decapbridge.com.
backend:
  name: git-gateway
  repo: nirav-zaveri/odc
  branch: claude/react-website-redesign-blog-ax2hox # must match the branch Netlify deploys — update this after merging to main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/3621232c-3088-4d14-a06f-a645f667ee45/pkce
  auth_token_endpoint: /sites/3621232c-3088-4d14-a06f-a645f667ee45/token
  gateway_url: https://gateway.decapbridge.com

  # See who published what, right in the git history.
  commit_messages:
    create: 'Create {{collection}} "{{slug}}" — {{author-name}} <{{author-login}}> via DecapBridge'
    update: 'Update {{collection}} "{{slug}}" — {{author-name}} <{{author-login}}> via DecapBridge'
    delete: 'Delete {{collection}} "{{slug}}" — {{author-name}} <{{author-login}}> via DecapBridge'
    uploadMedia: 'Upload "{{path}}" — {{author-name}} <{{author-login}}> via DecapBridge'
    deleteMedia: 'Delete "{{path}}" — {{author-name}} <{{author-login}}> via DecapBridge'
    openAuthoring: 'Message {{message}} — {{author-name}} <{{author-login}}> via DecapBridge'

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://jolly-taffy-67fd7e.netlify.app

# Where uploaded blog images are stored, and the public URL they're served from.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

# Requires manual publish/unpublish — safer default for a small clinic team.
publish_mode: simple

collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/content/blog"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "URL Slug",
          name: "slug",
          widget: "string",
          required: false,
          hint: "Leave blank to auto-generate from the title. Only edit this for an existing post if you also update any links to it.",
        }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - {
          label: "Excerpt",
          name: "excerpt",
          widget: "text",
          hint: "A one to two sentence summary shown on the blog list and when shared on social media.",
        }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - {
          label: "Tags",
          name: "tags",
          widget: "list",
          required: false,
          hint: "e.g. Patient Guide, Cosmetic Dentistry, Clinic Update",
        }
      - { label: "Author", name: "author", widget: "string", default: "Dr. Konika Chhajed Zaveri" }
      - {
          label: "Save as Draft",
          name: "draft",
          widget: "boolean",
          default: false,
          hint: "Draft posts are saved but won't appear on the live site until unchecked.",
        }
      - { label: "Post Content", name: "body", widget: "markdown" }
