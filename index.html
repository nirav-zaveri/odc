<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D53A5" />
    <title>Oracle Dental Care | Multi-Speciality Dental Clinic, Navsari</title>
    <meta
      name="description"
      content="Oracle Dental Care, Navsari — Dr. Konica Chhajed (BDS) and team offer gentle, advanced multi-speciality dental care for the whole family. Book your visit today."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-ink-800 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Netlify Identity widget + redirect: required so that the invite/reset
      email link (which lands here, on "/", with an auth token in the URL)
      can log the doctor in and forward them straight to /admin.
      See: https://decapcms.org/docs/add-to-your-site/#netlify-identity
    -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', (user) => {
          if (!user) {
            window.netlifyIdentity.on('login', () => {
              document.location.href = '/admin/'
            })
          }
        })
      }
    </script>
  </body>
</html>
