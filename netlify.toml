[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: let React Router handle every path client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# SECURITY HEADERS
#
# The Content-Security-Policy below is mirrored in vite.config.js under
# `preview.headers`, so `npm run build && npm run preview` reproduces the
# production policy locally. If you change one, change the other — otherwise
# a CSP violation will only show up after deploying.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking: belt (CSP frame-ancestors) and braces (legacy header).
    X-Frame-Options = "DENY"
    # Stop browsers guessing content types.
    X-Content-Type-Options = "nosniff"
    # Don't leak full URLs to third parties (e.g. the Google Maps embed).
    Referrer-Policy = "strict-origin-when-cross-origin"
    # This is a brochure site: it needs none of these device capabilities.
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = """
      default-src 'self'; \
      base-uri 'self'; \
      object-src 'none'; \
      frame-ancestors 'none'; \
      form-action 'self'; \
      script-src 'self'; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com; \
      img-src 'self' data: https://images.unsplash.com https://images.pexels.com; \
      frame-src https://www.google.com; \
      connect-src 'self'; \
      upgrade-insecure-requests"""

# ---------------------------------------------------------------------------
# The blog admin panel is a third-party app (Decap CMS) loaded from a CDN and
# talking to DecapBridge + GitHub. An earlier, tighter policy here broke media
# uploads with "Failed to persist media" — the resource and network directives
# were narrower than the CMS's actual surface, which cannot be reliably
# enumerated from outside.
#
# The trade-off taken: keep the STRUCTURAL protections that cost nothing and
# block real attacks (framing, plugin/object embedding, <base> injection), but
# do not constrain the third-party app's own network and worker usage. This is
# a login-gated path serving no public content, so the value of a tight policy
# here is low, while breaking the clinic's publishing workflow is expensive.
# The public pages keep the strict policy above, which is where it matters.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = """
      default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; \
      base-uri 'self'; \
      object-src 'none'; \
      frame-ancestors 'none'"""

# Hashed build assets are immutable — cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
